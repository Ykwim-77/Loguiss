version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: Loguiss
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Bossgames@123
      POSTGRES_DB: Loguiss
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: